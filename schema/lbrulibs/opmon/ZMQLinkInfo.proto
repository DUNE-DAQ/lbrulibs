syntax = "proto3";
package dunedaq.lbrulibs.opmon;



message ZMQLinkInfo {
    uint32 num_packets_received = 1;
    uint32 num_payloads = 2;
    float last_packet_size = 3;
    float bandwidth = 4;
    float last_message_timestamp = 6;
    bool subscriber_connected = 5;
    float run_marker = 7;
    string sink_name = 8;
    float subscriber_num_zero_packets = 9;
    bool sink_is_set = 10;
    float card_id = 11;
    float link_tag = 12;
    string source_link_string = 13;

}